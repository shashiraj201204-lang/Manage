services:
  - type: web
    name: xirus-telegram-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DATA_DIR
        value: /tmp/xirus-data
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: WEB_PASSWORD
        sync: false
      - key: CHAT_PASSWORD
        sync: false